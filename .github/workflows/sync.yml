name: sync-timetable

on:
  schedule:
    # every 6 hours, at :17 (GitHub cron is UTC and can be delayed a few minutes)
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull, validate and rewrite the school feed
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
        run: python3 sync.py

      - name: Publish if changed
        run: |
          git config user.name  "unnc-cal-bot"
          git config user.email "unnc-cal-bot@users.noreply.github.com"
          if git diff --quiet -- docs/; then
            echo "no change"
          else
            git add docs/
            git commit -m "sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
